name: Refresh lockfile once

on:
  push:
    branches:
      - "build/v0.1-foundation"

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: build/v0.1-foundation

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock Netlify Blobs dependency"
          git push origin HEAD:build/v0.1-foundation
